<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - RideNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <header id="nav"></header>
  <div class="auth-wrap">
    <form class="card card-pad auth-card" id="form" novalidate>
      <h2>Welcome back</h2>
      <p class="muted">Log in to manage your trips or listings.</p>
      <div id="err"></div>
      <div class="field"><label for="email">Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password"></div>
      <button class="btn block" type="submit">Log in</button>
      <p class="center small muted" style="margin:14px 0 0">No account? <a href="/register">Sign up</a></p>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <p class="small muted" style="margin:0"><strong>Demo logins</strong> (password <code>Demo@1234</code>):<br>
        <a href="#" data-demo="owner@demo.com">owner@demo.com</a> &middot; <a href="#" data-demo="owner3@demo.com">owner3@demo.com</a> &middot; <a href="#" data-demo="renter@demo.com">renter@demo.com</a></p>
    </form>
  </div>
  <footer id="footer"></footer>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
